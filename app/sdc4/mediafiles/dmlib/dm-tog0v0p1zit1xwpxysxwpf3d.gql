  (comp_tkd16hhh9wbn0qya2ykm0552:XdTemporal:SDC4Component { id: 'mc-tkd16hhh9wbn0qya2ykm0552', label: 'Issue Date', sdcType: 'XdTemporal', seq: '0000', description: 'The date the sender issued the document.' }),
  (cluster_fe17qp78l2yemauxwtoskjz5:Cluster:SDC4Component { id: 'mc-fe17qp78l2yemauxwtoskjz5', label: 'Receipt Advice Document', sdcType: 'Cluster', description: 'The header of a receipt advice: the customization and profile that govern it, its identifier, whether it is a copy, its UUID, when it was issued, its status and type, the note, and the line count. Members: Customization ID; Profile ID; Profile Execution ID; Receipt Advice ID; Copy Indicator; Document UUID; Issue Date; Issue Time; Document Status; Receipt Advice Type; note (Default); Line Count.' }),
  (comp_nsv2eblxq8s0vk28ue2vh1fl:XdBoolean:SDC4Component { id: 'mc-nsv2eblxq8s0vk28ue2vh1fl', label: 'Copy Indicator', sdcType: 'XdBoolean', seq: '0000', description: 'Whether this document is a copy of one sent before (true) or the original (false).' }),
  (comp_rgnvj03kjtej1s8brdeil4kq:XdString:SDC4Component { id: 'mc-rgnvj03kjtej1s8brdeil4kq', label: 'Customization ID', sdcType: 'XdString', seq: '0000', description: 'The identifier of the customization of the business document the sender applied: which published model governs this document. In this library a customization is a published model, immutable and versioned, not a rule set beside the schema.', minLength: '1', maxLength: '100' }),
