  (comp_mnuyvuxqsy0qskx8hiy6epff:XdToken:SDC4Component { id: 'mc-mnuyvuxqsy0qskx8hiy6epff', label: 'Document Status', sdcType: 'XdToken', seq: '0000', description: 'The status of the document with respect to its original state: the original, a revision of it, or its cancellation. UBL leaves the status code to profiles; these are this library\'s values.', enumerations: 'Original; Revised; Cancelled' }),
  (comp_eon5e85nnanzy6mlb60kati0:XdToken:SDC4Component { id: 'mc-eon5e85nnanzy6mlb60kati0', label: 'Receipt Advice Type', sdcType: 'XdToken', seq: '0000', description: 'What kind of receipt advice this is: the receipt of a delivery, or the receipt of goods returned. UBL leaves the type code to profiles; these are this library\'s values.', enumerations: 'Delivery; Return' }),
