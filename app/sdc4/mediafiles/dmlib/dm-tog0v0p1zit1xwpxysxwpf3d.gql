  (comp_z181ta9jftxc7k63rv4nz1zv:XdString:SDC4Component { id: 'mc-z181ta9jftxc7k63rv4nz1zv', label: 'Document Description', sdcType: 'XdString', seq: '0000', description: 'Free text describing the referenced document for a reader.', minLength: '1', maxLength: '500' }),
  (comp_k153quyn7i9ravd1b3c61ad9:XdString:SDC4Component { id: 'mc-k153quyn7i9ravd1b3c61ad9', label: 'Document Reference ID', sdcType: 'XdString', seq: '0000', description: 'The identifier of the referenced document.', minLength: '1', maxLength: '100' }),
  (comp_arra8d8x6kv6l5mluiomye3t:XdToken:SDC4Component { id: 'mc-arra8d8x6kv6l5mluiomye3t', label: 'Document Type', sdcType: 'XdToken', seq: '0000', description: 'What kind of document is referenced: a quotation, a contract, a catalogue, the originator\'s document, an earlier order, an order response, a despatch advice, a receipt advice, or another document. Revised at the ReceiptAdvice release to name the documents of the chain; the published Order, Order Response and Despatch Advice models keep composing the earlier list.', enumerations: 'Quotation; Contract; Catalogue; Originator document; Order; Order response; Despatch advice; Receipt advice; Other document' }),
