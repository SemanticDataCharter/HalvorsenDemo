  (comp_wa674d96vzd8um4nwbtjrorz:XdString:SDC4Component { id: 'mc-wa674d96vzd8um4nwbtjrorz', label: 'Document UUID', sdcType: 'XdString', seq: '0000', description: 'A universally unique identifier of this instance of the document.', minLength: '36', maxLength: '36', pattern: '[0-9a-fA-F-]{36}' }),
  (comp_wtnd4hzyrntlwtp4z3l1gcpr:XdString:SDC4Component { id: 'mc-wtnd4hzyrntlwtp4z3l1gcpr', label: 'Order ID', sdcType: 'XdString', seq: '0000', description: 'The identifier the buyer assigned to the order. Every later document in the chain (the order response, the despatch advice, the invoice, the remittance) refers back to it.', minLength: '1', maxLength: '50' }),
  (comp_mllhwxhu0zvxhwt32em2t821:XdString:SDC4Component { id: 'mc-mllhwxhu0zvxhwt32em2t821', label: 'Sales Order ID', sdcType: 'XdString', seq: '0000', description: 'The identifier the seller assigned to the order, when the seller has one.', minLength: '1', maxLength: '50' }),
