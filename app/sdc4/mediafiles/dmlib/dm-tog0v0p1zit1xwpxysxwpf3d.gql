  (comp_ato2r6lpk92i9e5djcwrna74:XdString:SDC4Component { id: 'mc-ato2r6lpk92i9e5djcwrna74', label: 'Profile ID', sdcType: 'XdString', seq: '0000', description: 'The identifier of the business process profile the document belongs to, when the parties agreed one.', minLength: '1', maxLength: '100' }),
