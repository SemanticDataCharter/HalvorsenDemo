  (cluster_ulo971f5gnqane7k9pd5iog3:Cluster:SDC4Component { id: 'mc-ulo971f5gnqane7k9pd5iog3', label: 'Despatch Document Reference', sdcType: 'Cluster', description: 'The despatch advice this receipt answers. Members: Document Reference.' }),
