  (dm_tog0v0p1zit1xwpxysxwpf3d:Node { coverage: 'Universal', creator: 'Timothy Cook', date: '2026-09-29 00:15:07.578621+00:00', description: 'A receipt advice as a governed record: the document header, the order and the despatch advice it answers, the parties by role in one shape, the shipment as received with each handling unit checked on the receipt date (the pallet identifier within its validity period or not, the pack specification version in force or not, the receiver decision with its exception), and the lines with the quantities received, short, rejected and over-supplied; with its provenance, audit event and the Business Document Audit, and the order workflow bound. The concepts are the OASIS Universal Business Language 2.3 common library, composed on the Default and ProvGov libraries. A conformant UBL ReceiptAdvice is a projection of this record.', format: 'text/xml', identifier: 'dm-tog0v0p1zit1xwpxysxwpf3d', language: 'en-US', relation: 'None', rights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', subject: 'receipt advice; receiving; business document; supply chain', title: 'Receipt Advice', type: 'SDC Data Model (DM)', id: 'https://semanticdatacharter.com/ns/sdc4/dm-tog0v0p1zit1xwpxysxwpf3d' }),
