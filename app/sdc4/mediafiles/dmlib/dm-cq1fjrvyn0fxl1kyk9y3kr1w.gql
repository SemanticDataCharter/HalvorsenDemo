  (dm_cq1fjrvyn0fxl1kyk9y3kr1w:Node { coverage: 'Universal', creator: 'Timothy Cook', date: '2026-09-30 20:46:24.191841+00:00', description: 'A purchase order under Torvale Markets profile as a governed record: the same components as the Order, the delivery terms narrowed to the one rule Torvale accepts, the pack specification version and the delivery window Torvale requires stated on every order, with the header, the contract, both parties, the delivery, the terms, the requirements, the totals and the lines required; with its provenance, audit event and the Business Document Audit, and the order workflow bound. The concepts are the OASIS Universal Business Language 2.3 common library, composed on the Default and ProvGov libraries. A conformant UBL Order is a projection of this record; the profile is the model, not a rule set beside the schema.', format: 'text/xml', identifier: 'dm-cq1fjrvyn0fxl1kyk9y3kr1w', language: 'en-US', relation: 'None', rights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', subject: 'purchase order; retailer profile; business document; supply chain', title: 'Torvale Order', type: 'SDC Data Model (DM)', id: 'https://semanticdatacharter.com/ns/sdc4/dm-cq1fjrvyn0fxl1kyk9y3kr1w' }),
