  (dm_u19w614300a8ot4a7qnn2o1c:Node { coverage: 'Universal', creator: 'Timothy Cook', date: '2026-09-29 16:18:45.215750+00:00', description: 'An invoice as a governed record: the document header with its type, due date and currencies, the order, the dispatch advice, the receipt advice and the earlier invoice it refers to, the parties by role in one shape with the payee and the tax representative, the delivery, the payment means and terms and any prepaid payment, the allowances and charges, the tax and withholding tax totals, the legal monetary total, and the lines with the quantity invoiced and the amounts exclusive and inclusive of tax; with its provenance, audit event and the Business Document Audit, and the order workflow bound. The concepts are the OASIS Universal Business Language 2.3 common library, composed on the Default and ProvGov libraries. A conformant UBL Invoice is a projection of this record.', format: 'text/xml', identifier: 'dm-u19w614300a8ot4a7qnn2o1c', language: 'en-US', relation: 'None', rights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', subject: 'invoice; billing; business document; supply chain', title: 'Invoice', type: 'SDC Data Model (DM)', id: 'https://semanticdatacharter.com/ns/sdc4/dm-u19w614300a8ot4a7qnn2o1c' }),
