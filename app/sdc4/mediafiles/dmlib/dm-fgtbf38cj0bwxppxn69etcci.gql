  (dm_fgtbf38cj0bwxppxn69etcci:Node { coverage: 'Universal', creator: 'Timothy Cook', date: '2026-10-01 13:14:00.253642+00:00', description: 'A remittance advice as a governed record: the document header with the totals debited, credited and paid and the payer\'s references, the invoice paid and the credit note taken into account as billing references, any other document, the accounting parties and the payee, the payment means, the tax total, and the lines, each the balance of one invoice less its credit note; with its provenance, audit event and the Business Document Audit, and the order workflow bound. The concepts are the OASIS Universal Business Language 2.3 common library, composed on the Default and ProvGov libraries. A conformant UBL RemittanceAdvice is a projection of this record.', format: 'text/xml', identifier: 'dm-fgtbf38cj0bwxppxn69etcci', language: 'en-US', relation: 'None', rights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', subject: 'remittance advice; payment; business document; supply chain', title: 'Remittance Advice', type: 'SDC Data Model (DM)', id: 'https://semanticdatacharter.com/ns/sdc4/dm-fgtbf38cj0bwxppxn69etcci' }),
