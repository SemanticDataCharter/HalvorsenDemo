  (dm_jkuyr38hydqaiwlq5vhp2rjr:Node { coverage: 'Universal', creator: 'Timothy Cook', date: '2026-10-01 10:50:23.074703+00:00', description: 'A credit note as a governed record: the document header with its type, due date and currencies, the discrepancy it resolves, the order, the invoice credited, the dispatch advice and the receipt advice it refers to, the parties by role in one shape with the payee and the tax representative, the delivery, the payment means and terms, the allowances and charges, the tax and withholding tax totals, the legal monetary total, and the lines with the quantity credited, the amounts exclusive and inclusive of tax and the discrepancy each resolves; with its provenance, audit event and the Business Document Audit, and the order workflow bound. The concepts are the OASIS Universal Business Language 2.3 common library, composed on the Default and ProvGov libraries. A conformant UBL CreditNote is a projection of this record.', format: 'text/xml', identifier: 'dm-jkuyr38hydqaiwlq5vhp2rjr', language: 'en-US', relation: 'None', rights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', subject: 'credit note; billing; business document; supply chain', title: 'Credit Note', type: 'SDC Data Model (DM)', id: 'https://semanticdatacharter.com/ns/sdc4/dm-jkuyr38hydqaiwlq5vhp2rjr' }),
