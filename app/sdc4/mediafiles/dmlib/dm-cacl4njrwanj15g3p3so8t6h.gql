  // --- Model-enriched structural data ---
  (dm_cacl4njrwanj15g3p3so8t6h:DataModel { id: 'dm-cacl4njrwanj15g3p3so8t6h', label: 'Despatch Advice', sdcType: 'DataModel', description: 'A despatch advice as a governed record: the document header, the orders it fulfils and the documents it refers to, the parties by role in one shape, the shipment with its consignment and its transport handling units (the serial shipping container code, the pallet identifier with the period it is valid for, the pack specification the receiver holds the shipper to), and the lines with the quantities delivered, on back order and outstanding; with its provenance, audit event and the Business Document Audit, and the order workflow bound. The concepts are the OASIS Universal Business Language 2.3 common library, composed on the Default and ProvGov libraries. A conformant UBL DespatchAdvice is a projection of this record.', dcSubject: 'despatch advice; advance ship notice; business document; supply chain', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal' }),
  (cluster_tpr7hl7tuq5qb7kv56h472d0:Cluster:SDC4Component { id: 'mc-tpr7hl7tuq5qb7kv56h472d0', label: 'Despatch Advice Governed Record', sdcType: 'Cluster', description: 'A despatch advice record. The governed record: the data cluster, the PROV activity and agent, the order or the response it fulfils as the PROV entity the activity used, and the audit event from the ProvGov library by identifier. Members: Despatch Advice; prov-activity (Provgov); prov-agent (Provgov); prov-entity (Provgov); audit-event (Provgov).' }),
  (cluster_t2tvd3wylxrstdeu5aw6gkw1:Cluster:SDC4Component { id: 'mc-t2tvd3wylxrstdeu5aw6gkw1', label: 'Audit Event', sdcType: 'Cluster', description: 'A logged access or custody event as data: what was done, by whom, on what, with what outcome and for what purpose. The audit-only case of sdc5 issue 002; state-changing operations are workflow transitions.' }),
  (comp_dkc2ccj5te35z9gd4bu1blcq:XdString:SDC4Component { id: 'mc-dkc2ccj5te35z9gd4bu1blcq', label: 'Audit Agent Reference', sdcType: 'XdString', seq: '0000', description: 'The acting agent (FHIR AuditEvent.agent.who). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_gcjyjrnp0wsfoelcp4m05c67:XdString:SDC4Component { id: 'mc-gcjyjrnp0wsfoelcp4m05c67', label: 'Audit Entity Reference', sdcType: 'XdString', seq: '0000', description: 'The entity the event concerns (FHIR AuditEvent.entity.what). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_fjhgr5fyqxt2crmg2cb5c513:XdString:SDC4Component { id: 'mc-fjhgr5fyqxt2crmg2cb5c513', label: 'Audit Event Identifier', sdcType: 'XdString', seq: '0000', description: 'The identifier of the audit event.', maxLength: '255' }),
  (comp_sndpbhm3xbd6qtbyxmvh3i0e:XdString:SDC4Component { id: 'mc-sndpbhm3xbd6qtbyxmvh3i0e', label: 'Data Subject Reference', sdcType: 'XdString', seq: '0000', description: 'The data subject or patient the event concerns (FHIR AuditEvent.patient; SDC DM.subject). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_nf1air1zbj8v9w66jozdxmyl:XdString:SDC4Component { id: 'mc-nf1air1zbj8v9w66jozdxmyl', label: 'On Behalf Of Reference', sdcType: 'XdString', seq: '0000', description: 'The party on whose behalf the agent acted (FHIR agent.onBehalfOf; prov:actedOnBehalfOf). Holds the IRI of the referenced thing.', maxLength: '2000', pattern: '\\S+' }),
  (comp_h3kdbvdtyalpvik97saaf0an:XdString:SDC4Component { id: 'mc-h3kdbvdtyalpvik97saaf0an', label: 'System Identifier', sdcType: 'XdString', seq: '0000', description: 'The system that handled the item (FHIR AuditEvent.source.observer; SDC AuditType.system-id).', maxLength: '255' }),
  (comp_ujir739mf1g8ajeczs9nzh9m:XdString:SDC4Component { id: 'mc-ujir739mf1g8ajeczs9nzh9m', label: 'System Location Name', sdcType: 'XdString', seq: '0000', description: 'The site or facility that handled the item (FHIR AuditEvent.agent.location; prov:atLocation).', maxLength: '255' }),
  (comp_ce1c8sydkov8bkv4dgdmwe5x:XdToken:SDC4Component { id: 'mc-ce1c8sydkov8bkv4dgdmwe5x', label: 'Audit Event Action', sdcType: 'XdToken', seq: '0000', description: 'The operation performed in a logged access event (FHIR AuditEvent.action). Read and Execute change no state and are audit facts, not workflow moves.', enumerations: 'C; R; U; D; E' }),
  (comp_rpz1czz06jhpahmfz30rblvp:XdToken:SDC4Component { id: 'mc-rpz1czz06jhpahmfz30rblvp', label: 'Audit Event Outcome', sdcType: 'XdToken', seq: '0000', description: 'The result of an audited event (FHIR AuditEvent.outcome).', enumerations: '0; 4; 8; 12' }),
  (comp_vbctgmdcwps5b3r3l6sboa6y:XdToken:SDC4Component { id: 'mc-vbctgmdcwps5b3r3l6sboa6y', label: 'Confidentiality', sdcType: 'XdToken', seq: '0000', description: 'The level of protection the information requires (HL7 v3 Confidentiality). At assembly the value populates a component\'s act tag.', enumerations: 'U; L; M; N; R; V' }),
  (comp_jujsdur1igws8orw6tvvlqco:XdToken:SDC4Component { id: 'mc-jujsdur1igws8orw6tvvlqco', label: 'Provenance Agent Type', sdcType: 'XdToken', seq: '0000', description: 'The functional role of an agent in an activity (FHIR Provenance.agent.type).', enumerations: 'enterer; performer; author; editor; verifier; legal; attester; informant; custodian; transmitter; assembler; transformer; composer' }),
  (comp_d1evlz8yvdlwt6ia9fjq4pgj:XdToken:SDC4Component { id: 'mc-d1evlz8yvdlwt6ia9fjq4pgj', label: 'Purpose of Use', sdcType: 'XdToken', seq: '0000', description: 'Why the information was used (HL7 v3 ActReason purpose of use). Activity context, not an access-control tag.', enumerations: 'TREAT; ETREAT; COC; HPAYMT; HOPERAT; HRESCH; CLINTRCH; PUBHLTH; PATRQT; HLEGAL; HMARKT' }),
  (comp_uwiosm2q9ym3ewr4de910s70:XdTemporal:SDC4Component { id: 'mc-uwiosm2q9ym3ewr4de910s70', label: 'Audit Recorded At', sdcType: 'XdTemporal', seq: '0000', description: 'When the audit event was recorded (FHIR AuditEvent.recorded).' }),
  (cluster_t86e5aegimwbwlz5d7qtt52h:Cluster:SDC4Component { id: 'mc-t86e5aegimwbwlz5d7qtt52h', label: 'Despatch Advice', sdcType: 'Cluster', description: 'A despatch advice as a governed record: the document header, the orders it fulfils and the documents it refers to, the parties by role in one shape, the shipment with its consignment and handling units, and the lines. A conformant UBL DespatchAdvice is a projection of this record. Members: Despatch Advice Document; Order Reference; Additional Document Reference; Despatch Supplier Party; Delivery Customer Party; Buyer Customer Party; Seller Supplier Party; Originator Customer Party; Shipment; Despatch Lines.' }),
  (cluster_m1cppki3rm9et0bhz1lej8l7:Cluster:SDC4Component { id: 'mc-m1cppki3rm9et0bhz1lej8l7', label: 'Additional Document Reference', sdcType: 'Cluster', description: 'Another document associated with the order. Members: Document Reference.' }),
  (cluster_uk03ahua6zv9d0i5tqq5qzmh:Cluster:SDC4Component { id: 'mc-uk03ahua6zv9d0i5tqq5qzmh', label: 'Document Reference', sdcType: 'Cluster', description: 'A reference to another document: its identifier, its issue date, what kind of document it is, and a description. Members: Document Reference ID; Document Reference Issue Date; Document Type; Document Description.' }),
  (comp_z181ta9jftxc7k63rv4nz1zv:XdString:SDC4Component { id: 'mc-z181ta9jftxc7k63rv4nz1zv', label: 'Document Description', sdcType: 'XdString', seq: '0000', description: 'Free text describing the referenced document for a reader.', minLength: '1', maxLength: '500' }),
  (comp_k153quyn7i9ravd1b3c61ad9:XdString:SDC4Component { id: 'mc-k153quyn7i9ravd1b3c61ad9', label: 'Document Reference ID', sdcType: 'XdString', seq: '0000', description: 'The identifier of the referenced document.', minLength: '1', maxLength: '100' }),
  (comp_hyw1higymybzar9tv2ze77xa:XdToken:SDC4Component { id: 'mc-hyw1higymybzar9tv2ze77xa', label: 'Document Type', sdcType: 'XdToken', seq: '0000', description: 'What kind of document is referenced: a quotation, a contract, a catalogue, the originator\'s document, an earlier order, or another document.', enumerations: 'Quotation; Contract; Catalogue; Originator document; Order; Other document' }),
  (comp_ncxchb14dkm790w4rnuzafju:XdTemporal:SDC4Component { id: 'mc-ncxchb14dkm790w4rnuzafju', label: 'Document Reference Issue Date', sdcType: 'XdTemporal', seq: '0000', description: 'The date the referenced document was issued, as its sender assigned it.' }),
  (cluster_nylve3b8ss572vh8zso2u4l7:Cluster:SDC4Component { id: 'mc-nylve3b8ss572vh8zso2u4l7', label: 'Buyer Customer Party', sdcType: 'Cluster', description: 'The party placing the order. Members: Customer Party.' }),
  (cluster_asbbdn0eof6713wx4y2e90c2:Cluster:SDC4Component { id: 'mc-asbbdn0eof6713wx4y2e90c2', label: 'Customer Party', sdcType: 'Cluster', description: 'A party in the customer role: the account identifiers each side assigned, and the party itself. Members: Customer Assigned Account ID; Supplier Assigned Account ID; Party.' }),
  (comp_ybdlctks32zkkteycr5y1eq8:XdString:SDC4Component { id: 'mc-ybdlctks32zkkteycr5y1eq8', label: 'Customer Assigned Account ID', sdcType: 'XdString', seq: '0000', description: 'The identifier of the customer\'s account as the customer itself assigned it; on a supplier party, the identifier of the supplier as the customer assigned it.', minLength: '1', maxLength: '100' }),
  (comp_nhvx21mf5ac81670xyrpwbaz:XdString:SDC4Component { id: 'mc-nhvx21mf5ac81670xyrpwbaz', label: 'Supplier Assigned Account ID', sdcType: 'XdString', seq: '0000', description: 'The identifier of the customer\'s account as the supplier assigned it.', minLength: '1', maxLength: '100' }),
  (cluster_useph7s4ienfhwerqx2thedj:Cluster:SDC4Component { id: 'mc-useph7s4ienfhwerqx2thedj', label: 'Party', sdcType: 'Cluster', description: 'An organization fulfilling a role in the business process, one shape whatever the role: its endpoint, its identifiers with their schemes, its name and its postal address from the Default library (the same components a NIEM person\'s organization and a FHIR organization compose), its legal entity, and its contact. Members: Endpoint ID; Party Identification; organization-name (Default); us-address (Default); international-address (Default); Party Legal Entity; Party Contact.' }),
  (comp_fpb149j9um0l676icmhyp56d:XdString:SDC4Component { id: 'mc-fpb149j9um0l676icmhyp56d', label: 'Endpoint ID', sdcType: 'XdString', seq: '0000', description: 'The identifier of the party\'s endpoint on the network the documents travel over, commonly a Global Location Number.', minLength: '1', maxLength: '100' }),
  (comp_xcn8r67fg7soty17homzok44:XdString:SDC4Component { id: 'mc-xcn8r67fg7soty17homzok44', label: 'Organization Name', sdcType: 'XdString', seq: '0000', description: 'The legal or registered name of an organization.', minLength: '1', maxLength: '200' }),
  (cluster_upawqojmcfg3qsf4ffzi47ho:Cluster:SDC4Component { id: 'mc-upawqojmcfg3qsf4ffzi47ho', label: 'International Address', sdcType: 'Cluster', description: 'A mailing address in any country: street lines, city, region, postal code, country and use.' }),
  (comp_ncxxt7wgs7soxw7kbmapxvg3:XdString:SDC4Component { id: 'mc-ncxxt7wgs7soxw7kbmapxvg3', label: 'Address (Line 1)', sdcType: 'XdString', seq: '0000', description: 'The first line of a street address: street number and name, or a post office box.', maxLength: '200' }),
  (comp_sexw93x5276zwsn1qx15htpv:XdString:SDC4Component { id: 'mc-sexw93x5276zwsn1qx15htpv', label: 'Address (Line 2)', sdcType: 'XdString', seq: '0000', description: 'The second line of a street address: apartment, suite, unit, building or floor, when the first line does not carry it.', maxLength: '200' }),
  (comp_toysvef93azt57fgh8rwpd4b:XdString:SDC4Component { id: 'mc-toysvef93azt57fgh8rwpd4b', label: 'City Name', sdcType: 'XdString', seq: '0000', description: 'The name of the city, town or village in an address.', maxLength: '100' }),
  (comp_gf841eedvv6cjiegs934srai:XdString:SDC4Component { id: 'mc-gf841eedvv6cjiegs934srai', label: 'Postal Code', sdcType: 'XdString', seq: '0000', description: 'The postal code of an address in any country, with no format constraint. Use US ZIP Code or Canada Postal Code where the format is known.', maxLength: '15' }),
  (comp_jw1b9q6ulyte599sdsqp2mvp:XdString:SDC4Component { id: 'mc-jw1b9q6ulyte599sdsqp2mvp', label: 'Region Name', sdcType: 'XdString', seq: '0000', description: 'The name of the state, province or other administrative region in an address, written out rather than coded.', maxLength: '100' }),
  (comp_b25dj42zxhm19pih328ga8pl:XdToken:SDC4Component { id: 'mc-b25dj42zxhm19pih328ga8pl', label: 'Address Use', sdcType: 'XdToken', seq: '0000', description: 'The purpose of an address.', enumerations: 'home; work; temp; old; billing' }),
  (comp_f2jicaigehz7xmwcp1gm5gh0:XdToken:SDC4Component { id: 'mc-f2jicaigehz7xmwcp1gm5gh0', label: 'Country Code ISO 3166', sdcType: 'XdToken', seq: '0000', description: 'The ISO 3166-1 alpha-2 code of a country or territory: the complete list of 249 officially assigned codes. Each value is defined by its Wikidata entity.', enumerations: 'AD; AE; AF; AG; AI; AL; AM; AO; AQ; AR; AS; AT; AU; AW; AX; AZ; BA; BB; BD; BE; BF; BG; BH; BI; BJ; BL; BM; BN; BO; BQ; BR; BS; BT; BV; BW; BY; BZ; CA; CC; CD; CF; CG; CH; CI; CK; CL; CM; CN; CO; CR; CU; CV; CW; CX; CY; CZ; DE; DJ; DK; DM; DO; DZ; EC; EE; EG; EH; ER; ES; ET; FI; FJ; FK; FM; FO; FR; GA; GB; GD; GE; GF; GG; GH; GI; GL; GM; GN; GP; GQ; GR; GS; GT; GU; GW; GY; HK; HM; HN; HR; HT; HU; ID; IE; IL; IM; IN; IO; IQ; IR; IS; IT; JE; JM; JO; JP; KE; KG; KH; KI; KM; KN; KP; KR; KW; KY; KZ; LA; LB; LC; LI; LK; LR; LS; LT; LU; LV; LY; MA; MC; MD; ME; MF; MG; MH; MK; ML; MM; MN; MO; MP; MQ; MR; MS; MT; MU; MV; MW; MX; MY; MZ; NA; NC; NE; NF; NG; NI; NL; NO; NP; NR; NU; NZ; OM; PA; PE; PF; PG; PH; PK; PL; PM; PN; PR; PS; PT; PW; PY; QA; RE; RO; RS; RU; RW; SA; SB; SC; SD; SE; SG; SH; SI; SJ; SK; SL; SM; SN; SO; SR; SS; ST; SV; SX; SY; SZ; TC; TD; TF; TG; TH; TJ; TK; TL; TM; TN; TO; TR; TT; TV; TW; TZ; UA; UG; UM; US; UY; UZ; VA; VC; VE; VG; VI; VN; VU; WF; WS; YE; YT; ZA; ZM; ZW' }),
  (cluster_kibeh8vp79shumcdyj8xzqw1:Cluster:SDC4Component { id: 'mc-kibeh8vp79shumcdyj8xzqw1', label: 'Party Contact', sdcType: 'Cluster', description: 'The contact at a party: its name, title and department, and the Default library\'s contact point (telephone, fax, email, website). Members: Contact Name; Contact Job Title; Contact Department; contact-point (Default).' }),
  (comp_bkw6awwe7kp01kowlwbgn21b:XdString:SDC4Component { id: 'mc-bkw6awwe7kp01kowlwbgn21b', label: 'Contact Department', sdcType: 'XdString', seq: '0000', description: 'The department the contact works in.', minLength: '1', maxLength: '100' }),
  (comp_ozkpv9buivm77ozkybm0ww39:XdString:SDC4Component { id: 'mc-ozkpv9buivm77ozkybm0ww39', label: 'Contact Job Title', sdcType: 'XdString', seq: '0000', description: 'The job title or function of the contact.', minLength: '1', maxLength: '100' }),
  (comp_fp533gyfb6yatp6jgpg2emb2:XdString:SDC4Component { id: 'mc-fp533gyfb6yatp6jgpg2emb2', label: 'Contact Name', sdcType: 'XdString', seq: '0000', description: 'The name of the contact at the party, a functional name (a department, a desk) in preference to a personal one.', minLength: '1', maxLength: '100' }),
  (cluster_d2xwhnb2vqzxw70jcizj9csx:Cluster:SDC4Component { id: 'mc-d2xwhnb2vqzxw70jcizj9csx', label: 'Contact Point', sdcType: 'Cluster', description: 'Ways to reach a person or organization: phone, fax, email, website, and the method and use of the contact.' }),
  (comp_wriny2gz8aqcvffmfpwbompk:XdLink:SDC4Component { id: 'mc-wriny2gz8aqcvffmfpwbompk', label: 'Website URL', sdcType: 'XdLink', seq: '0000', description: 'The URL of a web page or online resource, such as an organization\'s website or a person\'s profile page.' }),
  (comp_q922mqaon3yn5zlwf2bszf28:XdString:SDC4Component { id: 'mc-q922mqaon3yn5zlwf2bszf28', label: 'Email Address', sdcType: 'XdString', seq: '0000', description: 'An email address. The pattern requires a local part, an at sign and a domain with a dot; RFC 5321 limits the whole address to 254 characters.', maxLength: '254', pattern: '.+@.+\\..+' }),
  (comp_ll6ltsnvakomixuitxkbkxfz:XdString:SDC4Component { id: 'mc-ll6ltsnvakomixuitxkbkxfz', label: 'Fax Number', sdcType: 'XdString', seq: '0000', description: 'A facsimile telephone number, optionally starting with a plus sign and country code, with digits, spaces, hyphens and parentheses allowed.', maxLength: '20', pattern: '\\+?\\d[\\d\\s\\-\\(\\)]{6,18}' }),
  (comp_zpfwg52r88j6jdypj7rg71ke:XdString:SDC4Component { id: 'mc-zpfwg52r88j6jdypj7rg71ke', label: 'Phone Number', sdcType: 'XdString', seq: '0000', description: 'A telephone number, optionally starting with a plus sign and country code, with digits, spaces, hyphens and parentheses allowed.', maxLength: '20', pattern: '\\+?\\d[\\d\\s\\-\\(\\)]{6,18}' }),
  (comp_miqo30r5b554nyj7ubryw43x:XdToken:SDC4Component { id: 'mc-miqo30r5b554nyj7ubryw43x', label: 'Contact Method', sdcType: 'XdToken', seq: '0000', description: 'The communication channel of a contact point.', enumerations: 'phone; fax; email; pager; url; sms; other' }),
