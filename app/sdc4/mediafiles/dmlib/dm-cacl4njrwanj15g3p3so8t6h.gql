  (dm_cacl4njrwanj15g3p3so8t6h:Node { coverage: 'Universal', creator: 'Timothy Cook', date: '2026-09-28 22:27:01.125225+00:00', description: 'A despatch advice as a governed record: the document header, the orders it fulfils and the documents it refers to, the parties by role in one shape, the shipment with its consignment and its transport handling units (the serial shipping container code, the pallet identifier with the period it is valid for, the pack specification the receiver holds the shipper to), and the lines with the quantities delivered, on back order and outstanding; with its provenance, audit event and the Business Document Audit, and the order workflow bound. The concepts are the OASIS Universal Business Language 2.3 common library, composed on the Default and ProvGov libraries. A conformant UBL DespatchAdvice is a projection of this record.', format: 'text/xml', identifier: 'dm-cacl4njrwanj15g3p3so8t6h', language: 'en-US', relation: 'None', rights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', subject: 'despatch advice; advance ship notice; business document; supply chain', title: 'Despatch Advice', type: 'SDC Data Model (DM)', id: 'https://semanticdatacharter.com/ns/sdc4/dm-cacl4njrwanj15g3p3so8t6h' }),
