  (dm_kuntv2wlkw54h7nxe0kqhvi2:Node { coverage: 'Universal', creator: 'Timothy Cook', date: '2026-09-28 21:20:02.801424+00:00', description: 'The response of the seller to a purchase order as a governed record: the document header with the answer to the order as a whole, the order it answers and the documents it refers to, the contract, the parties by role in one shape, the delivery and its terms, the payment means and terms, allowances and charges, the transaction conditions, the tax total, the legal monetary total, and the lines each with their answer; with its provenance, audit event and the Business Document Audit, and the order workflow bound. The concepts are the OASIS Universal Business Language 2.3 common library, composed on the Default and ProvGov libraries. A conformant UBL OrderResponse is a projection of this record.', format: 'text/xml', identifier: 'dm-kuntv2wlkw54h7nxe0kqhvi2', language: 'en-US', relation: 'None', rights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', subject: 'order response; business document; supply chain', title: 'Order Response', type: 'SDC Data Model (DM)', id: 'https://semanticdatacharter.com/ns/sdc4/dm-kuntv2wlkw54h7nxe0kqhvi2' }),
