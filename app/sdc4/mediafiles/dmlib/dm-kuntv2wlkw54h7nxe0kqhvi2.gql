  // --- Model-enriched structural data ---
  (dm_kuntv2wlkw54h7nxe0kqhvi2:DataModel { id: 'dm-kuntv2wlkw54h7nxe0kqhvi2', label: 'Order Response', sdcType: 'DataModel', description: 'The response of the seller to a purchase order as a governed record: the document header with the answer to the order as a whole, the order it answers and the documents it refers to, the contract, the parties by role in one shape, the delivery and its terms, the payment means and terms, allowances and charges, the transaction conditions, the tax total, the legal monetary total, and the lines each with their answer; with its provenance, audit event and the Business Document Audit, and the order workflow bound. The concepts are the OASIS Universal Business Language 2.3 common library, composed on the Default and ProvGov libraries. A conformant UBL OrderResponse is a projection of this record.', dcSubject: 'order response; business document; supply chain', dcLanguage: 'en-US', dcRights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', dcCoverage: 'Universal' }),
  (cluster_xrtq55a6zyrnr068ja610u3n:Cluster:SDC4Component { id: 'mc-xrtq55a6zyrnr068ja610u3n', label: 'Order Response Governed Record', sdcType: 'Cluster', description: 'An order response record. The governed record: the data cluster, the PROV activity and agent, the order received as the PROV entity the activity used, and the audit event from the ProvGov library by identifier. Members: Order Response; prov-activity (Provgov); prov-agent (Provgov); prov-entity (Provgov); audit-event (Provgov).' }),
  (cluster_t2tvd3wylxrstdeu5aw6gkw1:Cluster:SDC4Component { id: 'mc-t2tvd3wylxrstdeu5aw6gkw1', label: 'Audit Event', sdcType: 'Cluster', description: 'A logged access or custody event as data: what was done, by whom, on what, with what outcome and for what purpose. The audit-only case of sdc5 issue 002; state-changing operations are workflow transitions.' }),
