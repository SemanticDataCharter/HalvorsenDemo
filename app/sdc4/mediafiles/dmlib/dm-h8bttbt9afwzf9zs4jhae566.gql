  (dm_h8bttbt9afwzf9zs4jhae566:Node { coverage: 'Universal', creator: 'Timothy Cook', date: '2026-09-28 10:23:24.998143+00:00', description: 'A purchase order as a governed record: the document header, the documents it refers to, the contract, the parties by role in one shape, the delivery and its terms, the payment means and terms, allowances and charges, the tax total, the anticipated monetary total, and the lines; with its provenance, audit event and the Business Document Audit, and the order workflow bound. The concepts are the OASIS Universal Business Language 2.3 common library, composed on the Default and ProvGov libraries. A conformant UBL Order is a projection of this record.', format: 'text/xml', identifier: 'dm-h8bttbt9afwzf9zs4jhae566', language: 'en-US', relation: 'None', rights: 'CC-BY http://creativecommons.org/licenses/by/3.0/', subject: 'purchase order; business document; supply chain', title: 'Order', type: 'SDC Data Model (DM)', id: 'https://semanticdatacharter.com/ns/sdc4/dm-h8bttbt9afwzf9zs4jhae566' }),
